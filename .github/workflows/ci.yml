name: CI - Test & Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          
      - name: Run Backend Tests with Coverage
        run: mvn clean test
        
      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: "**/target/site/jacoco/"

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: spark-performance-insight-ui/frontend/package-lock.json
          
      - name: Install Dependencies
        run: cd spark-performance-insight-ui/frontend && npm install
        
      - name: Run Frontend Tests with Coverage
        run: cd spark-performance-insight-ui/frontend && npm run test:coverage
        
      - name: Upload Vitest report
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report
          path: spark-performance-insight-ui/frontend/coverage/
