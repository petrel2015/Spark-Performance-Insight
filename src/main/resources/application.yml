server:
  port: 18081

spring:
  datasource:
    url: jdbc:duckdb:spark_performance_insight.db
    driver-class-name: org.duckdb.DuckDBDriver
    username: sa
    password: ""
  application:
    name: spark-performance-insight
  threads:
    virtual:
      enabled: true
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  ai:
    zhipuai:
      api-key: ${ZHIPU_API_KEY:fake_api_key}
      chat:
        options:
          model: glm-4.7
          temperature: 0.1
          max-tokens: 4096
    openai:
      api-key: ${OPENAI_API_KEY:fake_api_key}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: gpt-4-turbo
          temperature: 0.1

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.spark.insight.model
  configuration:
    map-underscore-to-camel-case: true

insight:
  ai:
    provider: ${AI_PROVIDER:zhipu}
  event-log-path: ./workspace/eventlog
  duckdb:
    threads: ${DUCKDB_THREADS:4}
    memory-limit: ${DUCKDB_MEMORY_LIMIT:2GB}
  scheduler:
    scan-interval-seconds: 3600
  comparison:
    ignore-categories:
      - classpath_entries

logging:
  config: classpath:log4j2.xml
  level:
    com.spark.insight.mapper: info